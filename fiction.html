  <main class="app-shell">
    <section class="project fiction-project" id="ocilentra">
      <div class="project-copy">
        <div class="project-head">
          <div>
            <h2>Ocilentra</h2>
            <p>PDF copy of <cite>Ocilentra: Central Aimela, Book One</cite>, a science fiction book I completed in 2015 as a teenager.</p>
          </div>
          <span class="chip">PDF</span>
        </div>
        <div class="links" aria-label="Ocilentra links">
          <a class="hbtn" href="assets/ocilentra.pdf">Download PDF</a>
        </div>
        <object class="pdf-embed" data="assets/ocilentra.pdf" type="application/pdf" aria-label="Embedded PDF copy of Ocilentra: Central Aimela, Book One">
          <p><a href="assets/ocilentra.pdf">Open the PDF</a>.</p>
        </object>
      </div>
      <div class="preview-stack" aria-label="Ocilentra maps and supplement">
        <div class="map-switcher" role="radiogroup" aria-label="Ocilentra supplemental views">
          <input class="map-radio" type="radio" name="ocilentra-view" id="ocilentra-view-political" checked>
          <input class="map-radio" type="radio" name="ocilentra-view" id="ocilentra-view-linguistic">
          <input class="map-radio" type="radio" name="ocilentra-view" id="ocilentra-view-supplement">
          <div class="map-toggle">
            <label class="map-tab" for="ocilentra-view-political">Political</label>
            <label class="map-tab" for="ocilentra-view-linguistic">Linguistic</label>
            <label class="map-tab" for="ocilentra-view-supplement">Supplement</label>
          </div>
          <div class="map-panels">
            <a class="map-panel map-panel-political" href="assets/ocilentra-map.svg" aria-label="Open political map of Ocilentra">
              <svg class="map-frame" viewBox="600 430 1140 2440" role="img" aria-label="Political map of Ocilentra preview">
                <image href="assets/ocilentra-map.svg" x="0" y="0" width="2384" height="3371"></image>
              </svg>
            </a>
            <a class="map-panel map-panel-linguistic" href="assets/ocilentra-linguistic-map.svg" aria-label="Open linguistic map of Ocilentra">
              <svg class="map-frame" viewBox="610 0 1240 2851" role="img" aria-label="Linguistic map of Ocilentra preview">
                <image href="assets/ocilentra-linguistic-map.svg" x="0" y="0" width="2384" height="2851"></image>
              </svg>
            </a>
            <div class="map-panel map-panel-supplement">
              <object class="supplement-embed" data="assets/ocilentra-throne-v-tarasintiene-dar-parquisant.pdf" type="application/pdf" aria-label="Embedded supplemental Ocilentra document">
                <p><a href="assets/ocilentra-throne-v-tarasintiene-dar-parquisant.pdf">Open the supplemental document</a>.</p>
              </object>
              <a class="mini-button supplement-link" href="assets/ocilentra-throne-v-tarasintiene-dar-parquisant.pdf">Open PDF</a>
            </div>
          </div>
        </div>
