name: Refresh Project Data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * *"

permissions:
  contents: write

concurrency:
  group: project-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out page repo
        uses: actions/checkout@v4
        with:
          path: site

      - name: Check out SFSC
        uses: actions/checkout@v4
        with:
          repository: aimesy/sfsc
          ref: master
          path: sfsc

      - name: Check out Tentatives
        uses: actions/checkout@v4
        with:
          repository: aimesy/tentatives
          ref: master
          path: tentatives

      - name: Check out Cividx if token is available
        env:
          PROJECT_REPO_TOKEN: ${{ secrets.PROJECT_REPO_TOKEN }}
        run: |
          if [ -n "$PROJECT_REPO_TOKEN" ]; then
            git clone --depth 1 "https://x-access-token:${PROJECT_REPO_TOKEN}@github.com/aimesy/cividx.git" cividx
          else
            echo "PROJECT_REPO_TOKEN unavailable; keeping existing Cividx tracker data."
          fi

      - name: Build tracker JSON
        working-directory: site
        env:
          SFSC_REPO: ../sfsc
          TENTATIVES_REPO: ../tentatives
          CIVIDX_REPO: ../cividx
        run: node scripts/build-project-data.mjs

      - name: Commit tracker data
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/project-data.json
          if git diff --cached --quiet; then
            echo "Project data already current."
          else
            git commit -m "Refresh project data"
            git push
          fi
