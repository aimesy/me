name: Refresh Project Data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: project-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://amyc.us/
    steps:
      - name: Check out page repo
        uses: actions/checkout@v4
        with:
          path: site

      - name: Require project repo token
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: test -n "$GH_TOKEN"

      - name: Check out SFSC
        uses: actions/checkout@v4
        with:
          repository: aimesy/sfsc
          ref: master
          path: sfsc
          token: ${{ secrets.GH_TOKEN }}

      - name: Check out Tentatives
        uses: actions/checkout@v4
        with:
          repository: aimesy/tentatives
          ref: master
          path: tentatives
          token: ${{ secrets.GH_TOKEN }}

      - name: Check out Cividx
        uses: actions/checkout@v4
        with:
          repository: aimesy/cividx
          ref: master
          path: cividx
          token: ${{ secrets.GH_TOKEN }}

      - name: Check out NDCS
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: aimesy/ndcs-data
          ref: master
          path: ndcs-data
          token: ${{ secrets.GH_TOKEN }}
          sparse-checkout: |
            data/manifest.json
            data/common/manifest.json
          sparse-checkout-cone-mode: false

      - name: Check out NYSC data
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: aimesy/nysc-data
          ref: master
          path: nysc-data
          token: ${{ secrets.GH_TOKEN }}
          sparse-checkout: |
            archive/case-directory/manifest.json
            archive/document-index.ndjson
            archive/promotions/*
            data/common/manifest.json
          sparse-checkout-cone-mode: false

      - name: Check out KCSC data
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: aimesy/kcsc-data
          ref: master
          path: kcsc-data
          token: ${{ secrets.GH_TOKEN }}
          sparse-checkout: |
            archive/cases-index.ndjson
            archive/cases/*
            data/manifest.json
          sparse-checkout-cone-mode: false

      - name: Build tracker JSON
        working-directory: site
        env:
          SFSC_REPO: ../sfsc
          TENTATIVES_REPO: ../tentatives
          CIVIDX_REPO: ../cividx
          NDCS_REPO: ../ndcs-data
          NYSC_REPO: ../nysc-data
          KCSC_REPO: ../kcsc-data
        run: node scripts/build-project-data.mjs

      - name: Commit tracker data
        id: commit
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/project-data.json
          if git diff --cached --quiet; then
            echo "Project data already current."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Refresh project data"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Pages
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@v5

      - name: Upload site
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy site
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retrying Pages deploy
        if: ${{ (steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch') && steps.deployment.outcome == 'failure' }}
        run: sleep 60

      - name: Deploy site retry
        if: ${{ (steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch') && steps.deployment.outcome == 'failure' }}
        id: deployment-retry
        uses: actions/deploy-pages@v4
