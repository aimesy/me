name: Refresh Project Data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: project-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out page repo
        uses: actions/checkout@v4
        with:
          path: site

      - name: Require project repo token
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: test -n "$GH_TOKEN"

      - name: Check out SFSC
        uses: actions/checkout@v4
        with:
          repository: aimesy/sfsc
          ref: master
          path: sfsc
          token: ${{ secrets.GH_TOKEN }}

      - name: Check out Tentatives
        uses: actions/checkout@v4
        with:
          repository: aimesy/tentatives
          ref: master
          path: tentatives
          token: ${{ secrets.GH_TOKEN }}

      - name: Check out Cividx
        uses: actions/checkout@v4
        with:
          repository: aimesy/cividx
          ref: master
          path: cividx
          token: ${{ secrets.GH_TOKEN }}

      - name: Build tracker JSON
        working-directory: site
        env:
          SFSC_REPO: ../sfsc
          TENTATIVES_REPO: ../tentatives
          CIVIDX_REPO: ../cividx
        run: node scripts/build-project-data.mjs

      - name: Commit tracker data
        id: commit
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/project-data.json
          if git diff --cached --quiet; then
            echo "Project data already current."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Refresh project data"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Pages
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@v5

      - name: Upload site
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy site
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        id: deployment
        uses: actions/deploy-pages@v4
